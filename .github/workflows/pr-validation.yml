name: PR validation (documentation foundation)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR content
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tracked files and chapter inventory
        run: python scripts/verify_foundation.py
      - name: Validate complete book inventories
        run: python scripts/validate_inventory.py
