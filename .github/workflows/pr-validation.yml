name: PR validation (documentation foundation + bilingual app)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR content
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tracked files and chapter inventory
        run: python scripts/verify_foundation.py
      - name: Validate complete book inventories
        run: python scripts/validate_inventory.py

  validate-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR content
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Clean dependency installation
        run: npm ci
      - name: TypeScript type checking
        run: npm run typecheck
      - name: ESLint validation
        run: npm run lint
      - name: Content integrity checks
        run: python scripts/validate_content.py
      - name: Next.js production static export
        run: npm run build
      - name: Verify exported routes, metadata and no-JS content
        run: python scripts/validate_static.py
